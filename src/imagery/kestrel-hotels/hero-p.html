<script>
window.__ready=false;
function rnd(seed){let s=seed;return()=>((s=(s*16807)%2147483647)/2147483647)}
const R=rnd(11);
const H=720; // horizon
let g=`<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0d1730"/><stop offset=".3" stop-color="#1d3156"/><stop offset=".55" stop-color="#4a4f78"/><stop offset=".72" stop-color="#a8687a"/><stop offset=".84" stop-color="#e6905e"/><stop offset=".93" stop-color="#f3b86e"/><stop offset="1" stop-color="#f0c27e"/>
 </linearGradient>
 <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e59a6a" stop-opacity="0"/><stop offset=".6" stop-color="#d48a6a" stop-opacity=".35"/><stop offset="1" stop-color="#3a3550" stop-opacity=".6"/></linearGradient>
 <linearGradient id="twr" x1="0" x2="1"><stop offset="0" stop-color="#3a4258"/><stop offset=".35" stop-color="#8590a8"/><stop offset=".5" stop-color="#c9cfdc"/><stop offset=".7" stop-color="#5a6278"/><stop offset="1" stop-color="#262c3c"/></linearGradient>
 <linearGradient id="bld" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3048"/><stop offset="1" stop-color="#151a2a"/></linearGradient>
</defs>
<rect width="2400" height="1010" fill="url(#sky)" transform="translate(0 -${1010-H-120})" />
<rect y="${H-10}" width="2400" height="${1010-H+10}" fill="#2a2b40"/>`;
// sun glow
g+=`<ellipse cx="1750" cy="${H+20}" rx="700" ry="160" fill="#ffd08a" opacity=".45" filter="url(#b40)"/>`;
// clouds
for(let i=0;i<9;i++){const x=R()*2400,y=200+R()*360,w=200+R()*500;g+=`<ellipse cx="${x}" cy="${y}" rx="${w}" ry="${8+R()*14}" fill="${y>420?'#e7a07a':'#8a7a9a'}" opacity="${.18+R()*.2}" filter="url(#b14)"/>`}
// far hills
g+=`<path d="M0,${H-30} C200,${H-70} 380,${H-40} 560,${H-60} S900,${H-80} 1100,${H-45} S1500,${H-70} 1700,${H-50} S2100,${H-75} 2400,${H-40} L2400,${H+10} L0,${H+10} Z" fill="#5d5370" opacity=".85"/>`;
// back layer buildings (hazy)
function layer(n,minH,maxH,yBase,col,winOp,seedShift){
  let s='';for(let i=0;i<n;i++){const w=30+R()*90,x=R()*2400,h=minH+R()*(maxH-minH),y=yBase-h;
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${h+40}" fill="${col}"/>`;
    if(R()<.4)s+=`<rect x="${x+w*.3}" y="${y-14}" width="${w*.4}" height="14" fill="${col}"/>`;
    // windows
    const cols=Math.floor((w-4)/6),rows=Math.floor(h/8);const warmB=R()<.65;
    for(let r=0;r<rows;r++){const floorLit=R()<winOp*2.2;for(let c=0;c<cols;c++){if(floorLit?R()<.7:R()<winOp*.25){s+=`<rect x="${x+3+c*6}" y="${y+5+r*8}" width="3.6" height="4.2" fill="${(warmB?R()<.85:R()<.2)?'#ffd596':'#d2e4ff'}" opacity="${.35+R()*.55}"/>`}}}
  }return s;}
g+=`<g opacity=".75">${layer(70,40,160,H+40,'#3a3a55',.12)}</g>`;
g+=`<rect y="${H-40}" width="2400" height="200" fill="url(#haze)"/>`;
// KL-style TV tower (suggested): left
const tx=640;
g+=`<g><path d="M${tx-10},${H+60} L${tx-6},${H-240} L${tx+6},${H-240} L${tx+10},${H+60} Z" fill="#2c3248"/>
 <ellipse cx="${tx}" cy="${H-262}" rx="44" ry="20" fill="#2c3248"/><rect x="${tx-40}" y="${H-262}" width="80" height="22" fill="#343b54"/>
 <rect x="${tx-38}" y="${H-258}" width="76" height="5" fill="#ffd79a" opacity=".85" filter="url(#glow)"/>
 <path d="M${tx-14},${H-282} L${tx},${H-300} L${tx+14},${H-282} Z" fill="#2c3248"/><rect x="${tx-1.5}" y="${H-420}" width="3" height="120" fill="#2c3248"/>
 <circle cx="${tx}" cy="${H-420}" r="3" fill="#ff5a4a" filter="url(#glow)"/></g>`;
// twin towers (suggested, not copied): stepped, tapering, with a skybridge
function tower(cx,top,base){let s='',w=96,y=base,steps=[[96,170],[88,140],[80,120],[70,90],[60,70],[48,50],[36,36],[24,26]];
  for(const [sw,sh] of steps){y-=sh;s+=`<rect x="${cx-sw/2}" y="${y}" width="${sw}" height="${sh+1}" fill="url(#twr)"/>`;
    for(let k=0;k<sh;k+=7)s+=`<rect x="${cx-sw/2+3}" y="${y+k}" width="${sw-6}" height="1.2" fill="#ffe7c0" opacity=".35"/>`;}
  s+=`<rect x="${cx-2}" y="${y-110}" width="4" height="110" fill="#b9c0d0"/><circle cx="${cx}" cy="${y-110}" r="3" fill="#fff" filter="url(#glow)"/>`;
  return s;}
g+=tower(1520,0,H+40)+tower(1660,0,H+40);
g+=`<rect x="1560" y="${H-330}" width="64" height="10" fill="#9aa3b8"/><path d="M1568,${H-320} L1590,${H-250} M1616,${H-320} L1594,${H-250}" stroke="#7a8398" stroke-width="3"/>`;
// glow on the towers' sunward edge
g+=`<rect x="1500" y="${H-560}" width="240" height="560" fill="#ffd8a0" opacity=".08" filter="url(#b14)"/>`;
// mid towers
g+=layer(26,180,420,H+80,'url(#bld)',.22);
// near layer, darker, bigger
g+=layer(16,80,240,H+260,'#121626',.3);
// streets: light trails
for(let i=0;i<5;i++){const y=H+150+i*40;g+=`<path d="M0,${y} C600,${y-10} 1400,${y+20} 2400,${y-5}" stroke="${i%2?'#ff8a5a':'#fff1c8'}" stroke-width="${2+i}" fill="none" opacity=".55" filter="url(#b2)"/>`}
// tiny aircraft light
g+=`<circle cx="1100" cy="250" r="2.5" fill="#fff" filter="url(#glow)"/><circle cx="1112" cy="252" r="1.6" fill="#ff5a4a"/>`;
document.getElementById('city').innerHTML=`<rect width="1080" height="1920" fill="#0d1730"/><g transform="translate(-1110 420)">${g}</g>`;

// mullions and transom
let m='';for(const x of [70,1010]){m+=`<div class="abs" style="left:${x-9}px;top:136px;width:18px;height:1290px;background:linear-gradient(90deg,#0c0e12,#2c313b 40%,#0e1014)"></div>`}
document.getElementById('mull').innerHTML=m;
// downlights + reflections
let rf='';for(const x of [300,780]){rf+=`<ellipse cx="${x}" cy="200" rx="40" ry="10" fill="#ffe2b0" opacity=".35" filter="url(#b14)"/>`}
document.getElementById('refl').innerHTML=rf;
document.body.insertAdjacentHTML('beforeend',[300,780].map(x=>`<div class="abs" style="left:${x-24}px;top:120px;width:48px;height:10px;border-radius:50%;background:#fff1d6;box-shadow:0 0 30px 10px rgba(255,220,170,.35)"></div>`).join(''));

// tablet: kestrel.com with the concierge
document.getElementById('tabscreen').innerHTML=`<div class="site" style="transform:scale(${676/1180})">
 <div class="nav"><div style="display:flex;align-items:center;gap:12px"><svg width="44" height="34"><path d="M3,30 L16,9 L22,18 L27,12 L40,30 Z" fill="none" stroke="#E4B363" stroke-width="3" stroke-linejoin="round"/><circle cx="36" cy="6" r="4" fill="none" stroke="#E4B363" stroke-width="2.5"/></svg><span style="font-weight:700;font-size:24px;letter-spacing:-.6px">Kestrel Hotels</span></div>
  <div><a>Hotels</a><a>Rooms</a><a>Dining</a><a>Offers</a><a style="background:#23395B;color:#fff;padding:10px 18px;border-radius:22px">Book a stay</a></div></div>
 <div class="hero" style="margin-right:440px;background:linear-gradient(#1d3156,#a8687a 70%,#f0b06e)">
  <svg width="706" height="330" style="position:absolute;left:0;top:0"><g fill="#1b2238"><rect x="300" y="60" width="26" height="270"/><rect x="340" y="60" width="26" height="270"/><rect x="60" y="200" width="60" height="130"/><rect x="140" y="160" width="50" height="170"/><rect x="420" y="190" width="70" height="140"/><rect x="520" y="140" width="60" height="190"/><rect x="600" y="210" width="80" height="120"/></g></svg>
  <div style="position:absolute;left:28px;bottom:28px;color:#fff"><div style="font-size:13px;letter-spacing:2px;color:#E4B363">KESTREL KUALA LUMPUR · BUKIT BINTANG</div><div style="font-size:44px;font-weight:500;letter-spacing:-1px;margin-top:6px">Stay above the city.</div></div>
 </div>
 <div style="margin:18px 474px 0 34px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
  ${[['Check in','Fri 20 Nov'],['Check out','Mon 23 Nov'],['Guests','2 adults']].map(r=>`<div style="background:#fff;border-radius:12px;padding:12px 14px"><div style="font-size:11px;letter-spacing:1px;color:#7a8396">${r[0].toUpperCase()}</div><div style="font-size:17px;font-weight:500;margin-top:4px">${r[1]}</div></div>`).join('')}
 </div>
 <div style="margin:12px 474px 0 34px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
  <div style="background:#fff;border-radius:12px;padding:14px"><div style="font-size:16px;font-weight:500">Skyline King</div><div style="font-size:13px;color:#7a8396;margin-top:2px">Floors 30–38 · 42 m² · tower view</div><div style="font-size:20px;font-weight:500;margin-top:10px">RM 980 <span style="font-size:12px;color:#7a8396;font-weight:400">/ night</span></div></div>
  <div style="background:#fff;border-radius:12px;padding:14px"><div style="font-size:16px;font-weight:500">Deluxe Twin</div><div style="font-size:13px;color:#7a8396;margin-top:2px">Floors 12–29 · 34 m² · city view</div><div style="font-size:20px;font-weight:500;margin-top:10px">RM 720 <span style="font-size:12px;color:#7a8396;font-weight:400">/ night</span></div></div>
 </div>
 <div class="chatp">
  <div style="background:#23395B;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px"><div style="width:30px;height:30px;border-radius:50%;background:#E4B363;display:grid;place-items:center;color:#23395B;font-weight:700">K</div><div><div style="font-weight:500">Ask Kestrel</div><div style="font-size:12px;color:#c9d3e6">Replies in seconds · a person is always nearby</div></div></div>
  <div style="flex:1;padding:14px;display:flex;flex-direction:column;gap:10px">
   <div class="msg g">We land at KLIA at 6 am. Can we check in early?</div>
   <div class="msg k">Welcome early! Rooms are guaranteed from 15:00, but if you book an early check-in for RM 150 your Skyline King is ready from 08:00. Our airport car takes about 55 minutes.<div class="src">↗ From: Kestrel KL · Arrivals &amp; check-in</div></div>
   <div class="msg g">Is parking included?</div>
   <div class="msg k">Yes, for one car, in the basement on levels B2–B3. Valet is at the Jalan Sultan Ismail entrance.<div class="src">↗ From: Kestrel KL · Getting here</div></div>
   <div style="display:flex;gap:6px;flex-wrap:wrap"><span style="border:1.5px solid #23395B;border-radius:14px;padding:5px 10px;font-size:12.5px">Add early check-in</span><span style="border:1.5px solid #23395B;border-radius:14px;padding:5px 10px;font-size:12.5px">Book the airport car</span></div>
  </div>
  <div style="margin:0 12px 12px;height:44px;border-radius:22px;background:#F5F3EE;display:flex;align-items:center;padding:0 16px;color:#8a93a6;font-size:14px">Ask about rooms, parking, the pool…</div>
 </div>
</div>`;
window.__ready=true;
</script>
