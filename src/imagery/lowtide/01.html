<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'NM';src:url('../../../briefs/v6/fonts/NeueMontreal-Regular.otf');font-weight:400}
@font-face{font-family:'NM';src:url('../../../briefs/v6/fonts/NeueMontreal-Medium.otf');font-weight:500}
@font-face{font-family:'NM';src:url('../../../briefs/v6/fonts/NeueMontreal-Bold.otf');font-weight:700}
@font-face{font-family:'NM';src:url('../../../briefs/v6/fonts/NeueMontreal-Italic.otf');font-weight:400;font-style:italic}
@font-face{font-family:'HJ';src:url('../../../assets/fonts/handjet.woff2')}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1600px;height:2000px;overflow:hidden;position:relative;font-family:'NM',sans-serif;color:#101820;
  background:radial-gradient(ellipse 70% 40% at 50% 0%,#efe3cf,#d9c9b0 45%,#a8977e 100%)}
.abs{position:absolute}
.frame{left:190px;top:190px;width:1220px;height:1600px;
  background:linear-gradient(90deg,#3a2a1c,#6a4d33 6%,#8a6a48 50%,#5a4029 94%,#2e2116);
  box-shadow:0 60px 80px rgba(40,25,10,.45),0 16px 24px rgba(40,25,10,.35),inset 0 2px 0 rgba(255,230,190,.35)}
.mat{position:absolute;inset:44px;background:#f7f3ea;box-shadow:inset 6px 8px 14px rgba(60,40,20,.35),inset -1px -1px 0 rgba(255,255,255,.6)}
.prog{position:absolute;left:84px;top:84px;width:964px;height:1344px;background:#F5F0E6;overflow:hidden;box-shadow:2px 3px 6px rgba(60,40,20,.25)}
.mul{mix-blend-mode:multiply}
.day{position:absolute;left:40px;right:40px;height:300px}
.lab{font-family:'NM';font-weight:500}
</style></head>
<body>
<script>window.__ready=false</script>
<!-- plaster wall texture -->
<svg class="abs" style="inset:0;mix-blend-mode:multiply;opacity:.35" width="1600" height="2000"><filter id="pl"><feTurbulence type="fractalNoise" baseFrequency=".012 .02" numOctaves="4" seed="3" result="t"/><feDiffuseLighting in="t" surfaceScale="2.5" lighting-color="#fff"><feDistantLight azimuth="270" elevation="60"/></feDiffuseLighting></filter><rect width="1600" height="2000" filter="url(#pl)"/></svg>
<!-- picture light -->
<div class="abs" style="left:560px;top:120px;width:480px;height:40px;border-radius:22px;background:linear-gradient(180deg,#d8b36a,#8a6522);box-shadow:0 10px 18px rgba(40,25,10,.4)"></div>
<div class="abs" style="left:784px;top:150px;width:32px;height:44px;background:linear-gradient(90deg,#8a6522,#d8b36a,#8a6522)"></div>
<div class="abs" style="left:300px;top:130px;width:1000px;height:900px;background:radial-gradient(ellipse 50% 60% at 50% 0%,rgba(255,236,190,.55),rgba(255,236,190,0));mix-blend-mode:screen;z-index:5"></div>

<div class="abs frame">
  <svg class="abs" style="inset:0;mix-blend-mode:overlay;opacity:.6" width="1220" height="1600"><filter id="oak"><feTurbulence type="fractalNoise" baseFrequency=".003 .25" numOctaves="3" seed="9"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .4  0 0 0 0 .3  0 0 0 1 0"/></filter><rect width="1220" height="1600" filter="url(#oak)"/></svg>
  <div class="mat">
    <div class="prog" id="prog">
      <!-- header -->
      <div class="abs" style="left:40px;top:34px;font-weight:700;font-size:132px;letter-spacing:-.06em;line-height:.8">LOWTIDE</div>
      <div class="abs mul" style="left:46px;top:39px;font-weight:700;font-size:132px;letter-spacing:-.06em;line-height:.8;color:#FF6B4A;opacity:.5">LOWTIDE</div>
      <div class="abs" style="right:40px;top:40px;text-align:right;font-size:17px;line-height:1.35;font-weight:500">PROGRAMME &amp; TIDE TABLE<br>20—22 FEBRUARY 2027<br>MOUNT LAVINIA BEACH, COLOMBO</div>
      <div class="abs" style="left:40px;right:40px;top:176px;border-top:5px solid #101820;padding-top:12px;display:flex;justify-content:space-between;font-size:17px;font-weight:500">
        <span>● SHORE STAGE</span><span>○ REEF STAGE</span><span>REEF CLOSES 30 MIN BEFORE HIGH WATER</span><span style="font-style:italic;font-weight:400">Three days. Two tides.</span></div>
      <div id="days"></div>
      <!-- site map strip -->
      <div class="abs" style="left:40px;right:40px;top:1150px;height:160px;border-top:5px solid #101820;padding-top:12px">
        <div style="display:flex;justify-content:space-between;font-size:16px;font-weight:700;letter-spacing:.05em"><span>SITE · WALK NORTH ALONG THE WATERLINE</span><span>LIFEGUARD 24H · FIRST AID AT THE LIGHTHOUSE FLAG</span></div>
        <svg width="884" height="120" style="display:block;margin-top:6px">
          <defs><pattern id="sea" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="3" fill="#3043C2"/></pattern></defs>
          <path d="M0 0 H884 V44 C 700 60 560 30 420 52 C 280 74 140 40 0 60 Z" fill="url(#sea)" class="mul" opacity=".9"/>
          <path d="M0 60 C 140 40 280 74 420 52 C 560 30 700 60 884 44" fill="none" stroke="#101820" stroke-width="2"/>
          <g font-family="NM" font-weight="700" font-size="14">
            <rect x="120" y="70" width="70" height="30" fill="#FF6B4A" class="mul"/><text x="200" y="91">SHORE</text>
            <rect x="520" y="62" width="60" height="26" fill="#18B2A6" class="mul"/><text x="590" y="81">REEF</text>
            <circle cx="360" cy="95" r="9" fill="#101820"/><text x="374" y="100">BAR</text>
            <circle cx="760" cy="90" r="9" fill="none" stroke="#101820" stroke-width="3"/><text x="774" y="95">+ AID</text>
            <path d="M20 112 h40 m-10 -8 l10 8 l-10 8" stroke="#101820" stroke-width="3" fill="none"/><text x="66" y="117">GATE · STATION RD</text>
          </g>
          <text x="420" y="24" font-family="NM" font-style="italic" font-size="16" fill="#F5F0E6">Indian Ocean</text>
        </svg>
      </div>
      <!-- fold creases -->
      <div class="abs" style="inset:0;pointer-events:none;background:
        linear-gradient(90deg,transparent calc(50% - 3px),rgba(255,255,255,.55) calc(50% - 1px),rgba(60,40,20,.22) 50%,transparent calc(50% + 3px)),
        linear-gradient(0deg,transparent calc(25% - 3px),rgba(255,255,255,.5) calc(25% - 1px),rgba(60,40,20,.18) 25%,transparent calc(25% + 3px)),
        linear-gradient(0deg,transparent calc(50% - 3px),rgba(255,255,255,.5) calc(50% - 1px),rgba(60,40,20,.2) 50%,transparent calc(50% + 3px)),
        linear-gradient(0deg,transparent calc(75% - 3px),rgba(255,255,255,.5) calc(75% - 1px),rgba(60,40,20,.18) 75%,transparent calc(75% + 3px))"></div>
      <div class="abs" style="inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(60,40,20,.05),rgba(0,0,0,0) 20%,rgba(0,0,0,0) 48%,rgba(60,40,20,.06) 50%,rgba(0,0,0,0) 52%,rgba(0,0,0,0) 80%,rgba(60,40,20,.05))"></div>
      <svg class="abs" style="inset:0;mix-blend-mode:screen;opacity:.45" width="964" height="1344"><filter id="iw"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .96  0 0 0 0 .94  0 0 0 0 .9  0 0 0 -2.2 1.25"/></filter><rect width="964" height="1344" filter="url(#iw)"/></svg>
    </div>
  </div>
  <!-- glass glare -->
  <div class="abs" style="inset:44px;background:linear-gradient(118deg,rgba(255,255,255,0) 18%,rgba(255,255,255,.16) 24%,rgba(255,255,255,0) 31%,rgba(255,255,255,0) 62%,rgba(255,255,255,.08) 66%,rgba(255,255,255,0) 70%);pointer-events:none"></div>
</div>

<!-- woven wristband tucked into the frame corner -->
<div class="abs" style="left:1210px;top:1600px;width:460px;height:62px;transform:rotate(-38deg);transform-origin:0 50%;filter:drop-shadow(10px 16px 10px rgba(40,25,10,.45));z-index:6">
  <div style="width:100%;height:100%;border-radius:6px;background:repeating-linear-gradient(90deg,#FF6B4A 0 3px,#ff7c5e 3px 6px),#FF6B4A;position:relative;overflow:hidden">
    <div class="abs" style="inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 2px,rgba(255,255,255,.08) 2px 4px)"></div>
    <div class="abs" style="left:24px;top:8px;font-weight:700;font-size:40px;letter-spacing:-.04em;color:#101820;line-height:1">LOWTIDE</div>
    <div class="abs" style="left:220px;top:16px;font-family:HJ;font-size:32px;color:#101820;line-height:1">FRI SAT SUN</div>
  </div>
</div>


<div class="abs" style="inset:0;background:radial-gradient(ellipse 80% 70% at 50% 40%,rgba(0,0,0,0) 55%,rgba(50,30,15,.45) 100%);z-index:8"></div>
<script>
const C={ink:'#101820',paper:'#F5F0E6',coral:'#FF6B4A',tq:'#18B2A6',ind:'#3043C2'};
const DAYS=[
 {k:'FRIDAY',date:'20.02',col:C.coral,hi:5.8,tides:'HIGH 05:48 · LOW 12:02 · HIGH 18:20 · LOW 00:31',acts:[['16:00','Ishara',0],['17:30','Coral Tape',1],['19:00','Kalu Ganga Sound System',0],['20:30','Pettah Dub',1],['21:00','Mira Sol',0],['23:00','NILA',0],['00:00','Haputale Hi-Fi',1],['01:30','Low Orbit',0]]},
 {k:'SATURDAY',date:'21.02',col:C.tq,hi:6.52,tides:'HIGH 06:31 · LOW 12:44 · HIGH 19:03 · LOW 01:14',acts:[['14:00','Marine Drive',0],['15:00','Galle Face Tapes',1],['16:00','Ranjan Reef',0],['18:00','Haputale Hi-Fi',0],['20:00','Tidal Static',0],['21:30','Kirala',1],['22:30','Ayu b2b Sanda',0],['01:00','Sea Glass',0]]},
 {k:'SUNDAY',date:'22.02',col:C.ind,hi:7.25,tides:'HIGH 07:15 · LOW 13:27 · HIGH 19:48 · LOW 01:57',acts:[['12:00','Pettah Dub',0],['13:00','Sanda (sunrise reprise)',1],['15:00','Dunes of Galle',0],['17:30','Wellawatte Tapes',0],['19:30','Kirala',0],['20:00','Monsoon Club',1],['22:00','Closing: all hands',0]]}];
const days=document.getElementById('days');
DAYS.forEach((D,di)=>{
  const top=230+di*305,W=884,H=230,t0=12,t1=30;
  const X=t=>(t-t0)/(t1-t0)*W, lv=t=>H*0.58-Math.cos((t-D.hi)/12.42*Math.PI*2)*H*0.3;
  let d=`M0 ${H}`;for(let t=t0;t<=t1+.01;t+=.15)d+=` L${X(t).toFixed(1)} ${lv(t).toFixed(1)}`;d+=` L${W} ${H} Z`;
  let ticks='';for(let t=12;t<=30;t+=2){const x=X(t);ticks+=`<line x1="${x}" y1="${H}" x2="${x}" y2="${H+8}" stroke="${C.ink}" stroke-width="2"/><text x="${x}" y="${H+26}" text-anchor="middle" font-family="NM" font-weight="500" font-size="14">${String(t%24).padStart(2,'0')}:00</text>`}
  const placed=[];
  const acts=D.acts.map((a,i)=>{let t=+a[0].slice(0,2)+(+a[0].slice(3))/60;if(t<6)t+=24;const x=X(t),y=lv(t);const w=(a[0].length+a[1].length)*8.6+14;
    let top=y;for(let xx=x;xx<=x+w;xx+=4){const tt=t0+xx/W*(t1-t0);top=Math.min(top,lv(tt))}let lvl=0,ly;for(;lvl<12;lvl++){ly=top-16-lvl*22;if(!placed.some(p=>x<p.x+p.w&&x+w>p.x&&ly>p.y-20&&ly-20<p.y))break}
    placed.push({x,w,y:ly});
    return `<line x1="${x}" y1="${y}" x2="${x}" y2="${ly+2}" stroke="${C.ink}" stroke-width="1.5"/>${a[2]?`<circle cx="${x}" cy="${y}" r="7" fill="${C.paper}" stroke="${C.ink}" stroke-width="3"/>`:`<circle cx="${x}" cy="${y}" r="8" fill="${C.ink}"/>`}<text x="${x+5}" y="${ly-2}" font-family="NM" font-weight="700" font-size="16">${a[0]} <tspan font-weight="400">${a[1]}</tspan></text>`}).join('');
  const div=document.createElement('div');div.className='day';div.style.top=top+'px';
  div.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-weight:700;font-size:40px;letter-spacing:-.03em;color:${D.col}">${D.k} <span style="color:${C.ink};font-weight:400">${D.date}</span></div><div style="font-size:15px;font-weight:500;letter-spacing:.04em">${D.tides}</div></div>
   <svg width="${W}" height="${H+30}" style="overflow:visible;display:block;margin-top:2px"><defs><pattern id="h${di}" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="3" fill="${D.col}"/></pattern></defs>
   <g style="mix-blend-mode:multiply" transform="translate(3 2)"><path d="${d}" fill="url(#h${di})"/></g><path d="${d.replace(/ L[\d.]+ [\d.]+ Z$/,'')}" fill="none" stroke="${D.col}" stroke-width="4" style="mix-blend-mode:multiply"/>
   <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="${C.ink}" stroke-width="2"/>${ticks}${acts}</svg>`;
  days.appendChild(div);
});
window.__ready=true;
</script>
</body></html>
