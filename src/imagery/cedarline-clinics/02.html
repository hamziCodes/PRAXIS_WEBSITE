<script>
const NS='http://www.w3.org/2000/svg';let s=5;const R=()=>{s=(s*16807)%2147483647;return s/2147483647};

for(let i=-12;i<=12;i++){const xb=1250+i*230;const t=(1060-vy)/(1350-vy);const xt=vx+(xb-vx)*t;E('path',{d:`M${xt} 1060 L${xb} 1350`},j)}
[1110,1185,1290].forEach(y=>E('path',{d:`M0 ${y} L2400 ${y}`},j));

[[880,1060],[1620,1060]].forEach(([x,y])=>{E('ellipse',{cx:x,cy:y+30,rx:120,ry:16,fill:'#2e2a26',opacity:.3,filter:'url(#b8)'},p);
  E('rect',{x:x-90,y:y-150,width:180,height:180,rx:6,fill:'#2b2e2c'},p);E('rect',{x:x-90,y:y-150,width:30,height:180,fill:'#fff',opacity:.08},p);
  for(let i=0;i<40;i++){const a=R()*Math.PI,r=40+R()*70;E('path',{d:`M${x} ${y-150} q ${Math.cos(a)*r*.5} ${-r*.9} ${Math.cos(a)*r} ${-Math.sin(a)*r*1.4}`,stroke:['#4f6e3a','#6b8a46','#3d5a2e','#8a8f4c'][i%4],'stroke-width':4+R()*3,fill:'none','stroke-linecap':'round'},p)}});

for(let i=0;i<22;i++){const x=R()*2400,y=1090+R()*250,sc=.5+R()*.6,rot=R()*360;const g=E('g',{transform:`translate(${x} ${y}) rotate(${rot}) scale(${sc} ${sc*.45})`},lv);
  E('path',{d:'M0 -30 L6 -14 L20 -20 L14 -4 L28 0 L12 6 L16 22 L0 12 L-16 22 L-12 6 L-28 0 L-14 -4 L-20 -20 L-6 -14Z',fill:['#b5482a','#c9762d','#8f3a22','#d29a3a'][i%4]},g);
