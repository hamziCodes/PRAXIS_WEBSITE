<!doctype html>
<meta charset="utf-8">
<title>Contact sheet</title>
<body style="margin:0;background:#111">
<script>
// sheet(src, step, cols, thumbW): seeks a clip every `step` seconds and tiles frames into a labelled grid. Returns a PNG data URL.
const seek = (v, t) => new Promise((r) => {
  let done = false; const fin = () => { if (!done) { done = true; r(); } };
  v.addEventListener('seeked', () => (v.requestVideoFrameCallback ? v.requestVideoFrameCallback(fin) : fin(), setTimeout(fin, 300)), { once: true });
  v.currentTime = t;
});
window.meta = async (src) => {
  const v = document.createElement('video'); v.muted = true; v.preload = 'auto'; v.src = src;
  await new Promise((r, j) => { v.onloadedmetadata = r; v.onerror = () => j(new Error('load ' + src)); });
  return { w: v.videoWidth, h: v.videoHeight, d: v.duration };
};
window.sheet = async (src, step = 1, cols = 8, thumbW = 240, t0 = 0, t1 = 1e9) => {
  const v = document.createElement('video'); v.muted = true; v.preload = 'auto'; v.src = src;
  await new Promise((r, j) => { v.onloadedmetadata = r; v.onerror = () => j(new Error('load ' + src)); });
  const times = []; for (let t = t0; t < Math.min(v.duration, t1) - 0.02; t += step) times.push(+t.toFixed(3));
  const tw = thumbW, th = Math.round(tw * v.videoHeight / v.videoWidth), lab = 22;
  const rows = Math.ceil(times.length / cols);
  const c = document.createElement('canvas'); c.width = cols * (tw + 4) + 4; c.height = rows * (th + lab + 4) + 4;
  const g = c.getContext('2d'); g.fillStyle = '#222'; g.fillRect(0, 0, c.width, c.height);
  g.font = '16px monospace'; g.textBaseline = 'top';
  for (let i = 0; i < times.length; i++) {
    await seek(v, times[i]);
    const x = 4 + (i % cols) * (tw + 4), y = 4 + Math.floor(i / cols) * (th + lab + 4);
    g.drawImage(v, x, y + lab, tw, th);
    g.fillStyle = '#ff0'; g.fillText(times[i].toFixed(2) + 's', x + 2, y + 3);
  }
  return { url: c.toDataURL('image/png'), w: v.videoWidth, h: v.videoHeight, d: v.duration };
};
</script>
